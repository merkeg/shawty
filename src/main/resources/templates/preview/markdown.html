{#include entry-base}
{#extraStyles}
<style>
    .markdown-body { color: #e5e7eb; line-height: 1.75; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        color: #f9fafb; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; line-height: 1.3;
    }
    .markdown-body h1 { font-size: 2em;   border-bottom: 1px solid #374151; padding-bottom: 0.3em; }
    .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid #374151; padding-bottom: 0.2em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body h5 { font-size: 0.875em; }
    .markdown-body h6 { font-size: 0.85em; color: #9ca3af; }
    .markdown-body p  { margin-top: 0; margin-bottom: 1em; }
    .markdown-body a  { color: #60a5fa; text-decoration: underline; }
    .markdown-body a:hover { color: #93c5fd; }
    .markdown-body strong { font-weight: 700; color: #f9fafb; }
    .markdown-body em    { font-style: italic; }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; margin-bottom: 1em; }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.25em; }
    .markdown-body li > ul, .markdown-body li > ol { margin-bottom: 0; }
    .markdown-body blockquote {
        border-left: 4px solid #4b5563; margin: 0 0 1em 0;
        padding: 0.5em 1em; color: #9ca3af; background: #1f2937; border-radius: 0 0.375rem 0.375rem 0;
    }
    .markdown-body blockquote > :last-child { margin-bottom: 0; }
    .markdown-body code {
        background: #1f2937; color: #f472b6; padding: 0.15em 0.4em;
        border-radius: 0.25rem; font-size: 0.875em; font-family: ui-monospace, monospace;
    }
    .markdown-body pre {
        background: #1f2937; border-radius: 0.5rem; padding: 1em;
        overflow-x: auto; margin-bottom: 1em;
    }
    .markdown-body pre code {
        background: transparent; color: #e5e7eb; padding: 0;
        font-size: 0.875em; border-radius: 0;
    }
    .markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
    .markdown-body th, .markdown-body td {
        border: 1px solid #374151; padding: 0.5em 0.75em; text-align: left;
    }
    .markdown-body th { background: #1f2937; font-weight: 600; color: #f9fafb; }
    .markdown-body tr:nth-child(even) { background: #1f2937; }
    .markdown-body hr { border: none; border-top: 1px solid #374151; margin: 1.5em 0; }
    .markdown-body img { max-width: 100%; border-radius: 0.5rem; }
</style>
{/extraStyles}
{#previewPanel}
<div class="overflow-auto max-h-[70vh] bg-gray-900">
    <div class="markdown-body p-8">
        {renderedContent}
    </div>
</div>
{/previewPanel}
{/include}
