{#include entry-base}
{#previewPanel}
<div class="overflow-auto max-h-[70vh] bg-gray-900">
    {#if hasArchiveEntries}
    <table class="w-full text-sm">
        <thead>
            <tr class="border-b border-gray-700">
                <th class="text-left px-4 py-2 text-gray-400 font-medium w-8"></th>
                <th class="text-left px-4 py-2 text-gray-400 font-medium">Name</th>
            </tr>
        </thead>
        <tbody>
            {#for item in archiveEntries}
            <tr class="border-b border-gray-800 hover:bg-gray-800/50 transition-colors">
                <td class="px-4 py-2 text-gray-500">
                    {#if item.endsWith("/")}
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-yellow-400">
                        <path d="M3.75 3A1.75 1.75 0 0 0 2 4.75v3.26a3.235 3.235 0 0 1 1.75-.51h12.5c.644 0 1.245.188 1.75.51V6.75A1.75 1.75 0 0 0 16.25 5h-4.836a.25.25 0 0 1-.177-.073L9.823 3.513A1.75 1.75 0 0 0 8.586 3H3.75ZM3.75 9A1.75 1.75 0 0 0 2 10.75v4.5c0 .966.784 1.75 1.75 1.75h12.5A1.75 1.75 0 0 0 18 15.25v-4.5A1.75 1.75 0 0 0 16.25 9H3.75Z"/>
                    </svg>
                    {#else}
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-gray-500">
                        <path d="M3 3.5A1.5 1.5 0 0 1 4.5 2h6.879a1.5 1.5 0 0 1 1.06.44l4.122 4.12A1.5 1.5 0 0 1 17 7.622V16.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16.5v-13Z"/>
                    </svg>
                    {/if}
                </td>
                <td class="px-4 py-2 text-gray-200 font-mono text-xs">{item}</td>
            </tr>
            {/for}
        </tbody>
    </table>
    {#else}
    <div class="flex flex-col items-center justify-center gap-3 p-10 text-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="w-14 h-14 text-gray-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"/>
        </svg>
        <p class="text-sm">No preview available</p>
    </div>
    {/if}
</div>
{/previewPanel}
{/include}
